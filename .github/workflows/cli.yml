name: cli

# La CLI deve funzionare identica su Linux, macOS e Windows: build TypeScript
# + smoke test (--help e --version) su tutti e tre, con le Node supportate
# (engines: >=18). Gira solo quando cambia qualcosa sotto cli/.
on:
  push:
    branches: [main]
    paths: ["cli/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", ".github/workflows/cli.yml"]
  workflow_dispatch:

jobs:
  build-test:
    name: build+test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/index.js --version
      # Lo script di installazione macOS/Linux deve almeno essere sintatticamente valido (POSIX sh).
      - run: sh -n install.sh
        if: runner.os != 'Windows'
