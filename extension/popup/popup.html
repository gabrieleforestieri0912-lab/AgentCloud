<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentCloud Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="sparkle">✦</span>
      <span class="title">AgentCloud Copilot</span>
    </div>
    <span class="status-badge" id="statusBadge">Pronto</span>
  </div>

  <div class="content">
    <div class="field">
      <label for="agentSelect">Seleziona Agente</label>
      <select id="agentSelect">
        <option value="support-agent">Customer Support Agent</option>
        <option value="email-assistant">Email Assistant</option>
        <option value="lead-qualifier">Lead Qualifier</option>
      </select>
    </div>

    <div class="field">
      <div class="context-bar">
        <label for="promptInput">Istruzione / Domanda</label>
        <button id="attachContextBtn" class="btn-secondary" title="Includi il testo della pagina attiva">
          + Includi Pagina
        </button>
      </div>
      <textarea id="promptInput" rows="3" placeholder="Scrivi un prompt o chiedi di analizzare la pagina..."></textarea>
      <div id="contextPreview" class="context-preview hidden"></div>
    </div>

    <button id="runBtn" class="btn-primary">
      <span>Esegui Agente</span>
    </button>

    <div id="resultContainer" class="result-box hidden">
      <div class="result-header">
        <span>Risposta Agente</span>
        <button id="copyBtn" class="btn-icon">Copia</button>
      </div>
      <div id="resultText" class="result-text"></div>
    </div>
  </div>

  <div class="footer">
    <a href="https://agentcloud.agency/dashboard" target="_blank">Apri Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
