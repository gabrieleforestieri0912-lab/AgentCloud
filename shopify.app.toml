# Configurazione dell'app Shopify "AgentCloud" per Shopify CLI.
#
# A cosa serve: registra URL, redirect, scope e webhook (inclusi i tre topic
# GDPR obbligatori) con `shopify app deploy`. Senza questo file la dashboard
# mostra solo la versione rilasciata (sola lettura) e i webhook di conformità
# non risultano configurati → i controlli automatici falliscono.
#
# NOTA: contiene solo il client_id (chiave API pubblica, non un segreto).
# Il client secret resta SOLO in SHOPIFY_API_SECRET (env di Vercel), mai qui.
# Al primo deploy la CLI chiede a quale app collegarsi: scegli l'app
# AgentCloud esistente, NON crearne una nuova.

client_id = "461eff50e7ece493b4ed79762975b42d"
name = "AgentCloud"
# URL che Shopify incapsula in un iframe dentro l'amministratore: deve essere
# l'interfaccia dell'app, non la landing di marketing. La pagina /shopify
# carica App Bridge e autentica le richieste con il session token.
application_url = "https://www.agentcloud.agency/shopify"
embedded = true

# Scope: solo ciò che i tool dell'agente usano davvero.
# - write_orders/write_customers/read_content/write_content rimossi: nessun
#   tool scrive ordini o clienti né produca contenuto, e permessi inutili
#   minano la fiducia del merchant in fase di installazione.
# - write_discounts aggiunto: shopify_create_discount chiama
#   discountCodeBasicCreate, che lo richiede esplicitamente.
# - read_all_orders NON è qui: è un scope protetto soggetto ad approvazione
#   Shopify e il rilascio viene rifiutato finché l'approvazione non è in
#   essere (verificato in deploy del 2026-10-25, errore di validazione su
#   `scopes: read_all_orders`). Quando la richiesta di accesso completo alla
#   cronologia ordini sarà approvata, riaggiungerlo QUI e nell'env
#   SHOPIFY_SCOPES, altrimenti read_orders copre solo gli ultimi 60 giorni.
# L'env SHOPIFY_SCOPES (URL di consenso OAuth) deve contenere la STESSA
# lista, altrimenti il flusso parte con invalid_scope.
[access_scopes]
scopes = "read_products,write_products,read_orders,read_inventory,write_inventory,read_customers,write_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://www.agentcloud.agency/api/shopify/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://www.agentcloud.agency/api/webhooks/shopify/app-uninstalled"

# Un solo endpoint per i tre topic GDPR obbligatori: lo smistamento avviene su
# `X-Shopify-Topic` (vedi src/lib/shopify/compliance.ts).
[[webhooks.subscriptions]]
uri = "https://www.agentcloud.agency/api/webhooks/shopify/compliance"
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
